# 8. Google AI / Antigravity / Cloud Code Assist / Gemini / DeepMind / NotebookLM
# 9. OpenAI / ChatGPT / Sora / Operator / SearchGPT
# 10. Microsoft / GitHub Copilot / Designer
# 11. AI IDE и ассистенты (Cursor / Windsurf / Zed / Trae / Cline / Devin / Aider)
